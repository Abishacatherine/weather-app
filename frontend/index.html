<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Weather App</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    input { padding: 8px; width: 200px; }
    button { padding: 8px 12px; margin-left: 10px; }
    #result { margin-top: 20px; font-size: 16px; }
  </style>
</head>
<body>
  <h2>Weather App</h2>
  <input type="text" id="city" placeholder="Enter city" value="Chennai,IN" />
  <button onclick="getWeather()">Get Weather</button>

  <div id="result"></div>

  <script>
    async function getWeather() {
      const city = document.getElementById("city").value.trim();
      if (!city) {
        alert("Please enter a city");
        return;
      }

      const url = `https://im4d4o5107.execute-api.us-east-1.amazonaws.com/dev/weather?city=${encodeURIComponent(city)}`;
      console.log("Request URL:", url); // Debug

      try {
        const response = await fetch(url);
        const data = await response.json();

        if (response.status !== 200) {
          document.getElementById("result").textContent = `Error: ${data.error || JSON.stringify(data)}`;
          return;
        }

        document.getElementById("result").innerHTML = `
          <strong>City:</strong> ${data.city} <br>
          <strong>Temperature:</strong> ${data.temperature} °C <br>
          <strong>Description:</strong> ${data.description}
        `;
      } catch (err) {
        document.getElementById("result").textContent = "Error: " + err.message;
      }
    }

    // Optional: auto-fetch default city on page load
    window.onload = getWeather;
  </script>
</body>
</html>
